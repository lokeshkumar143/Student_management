services:
  - type: web
    name: acadverify-student-management
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_data.py && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
